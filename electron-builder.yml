# 打包配置：pnpm dist 生成安装包，pnpm dist:dir 只生成可直接运行的程序目录
appId: app.videodedup.desktop
productName: 视频去重工具
# 安装包文件名只用英文，避免在网盘、下载工具中出现乱码
artifactName: video-dedup-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
# 程序只需要构建结果：界面和主进程用到的依赖都已打包进 out 目录
files:
  - out/**
  - package.json
# FFmpeg 放在 resources/ffmpeg 目录中（程序按这个位置查找），并附上它的许可证和源码的获取方式。
# FFmpeg 由 scripts/prepare-ffmpeg.mjs 准备在 build/ffmpeg/bin 中（pnpm dist 会先执行它）：它只准备当前系统的 FFmpeg，
# 所以每个系统的安装包需要在对应的系统上打包
extraResources:
  - from: build/ffmpeg/bin
    to: ffmpeg
  - from: build/ffmpeg
    to: ffmpeg
    filter:
      - COPYING.GPLv3
      - SOURCES.md
mac:
  category: public.app-category.video
  target: [dmg, zip]
  # Apple 芯片版带的 FFmpeg 需要 macOS 15 及以上。Intel 芯片版的 FFmpeg 没有这个限制，
  # 打包时加上 -c.mac.minimumSystemVersion=13.0，放宽到 Electron 本身的要求
  minimumSystemVersion: "15.0"
  # 没有开发者证书时做 ad-hoc 签名：签名完整时，别人下载后 macOS 提示“无法验证开发者”，可以在
  # “系统设置 → 隐私与安全性”中选择仍要打开；不签名时会提示“已损坏”，无法打开。
  # ad-hoc 签名不能与 hardened runtime 一起使用。有 Developer ID 证书时，打包时指定
  # -c.mac.identity="证书名称" -c.mac.hardenedRuntime=true，并按 electron-builder 的说明做公证
  identity: "-"
  hardenedRuntime: false
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: AudioVideo
